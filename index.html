<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Hola Mundo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            color: pink;
        }
        .header-negro {
            background-color: black;
            color: white;
            padding: 20px 0;
            margin-bottom: 20px;
        }
        /* Para asegurar que el texto de las etiquetas del formulario sea legible */
        .form-label {
            color: black;
        }
    </style>
</head>
<body>
    <header class="header-negro">
        <div class="container text-center">
            <h2>Gestión de Empleados</h2>
        </div>
    </header>

    <div class="container">
                
        <div class="card shadow-sm mt-4">
            <div class="card-body">
                <h4 class="card-title text-dark mb-4">Registro de Nuevo Empleado</h4>
                <form>
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Ej. Juan Pérez" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="email" placeholder="juan.perez@empresa.com" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="cargo" class="form-label">Cargo / Puesto</label>
                        <input type="text" class="form-control" id="cargo" placeholder="Ej. Desarrollador Web" required>
                    </div>

                    <div class="mb-3">
                        <label for="departamento" class="form-label">Departamento</label>
                        <select class="form-select" id="departamento">
                            <option value="ti">Tecnología de la Información (TI)</option>
                            <option value="rh">Recursos Humanos</option>
                            <option value="ventas">Ventas</option>
                            <option value="marketing">Marketing</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">Registrar Empleado</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
